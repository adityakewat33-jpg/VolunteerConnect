<!DOCTYPE html>
<html>
<head>
  <title>Profile | VolunteerConnect</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<div class="nav-right">
  <button class="nav-btn" onclick="window.location.href='dashboard.html'">
    Back
  </button>
</div>

<!-- PROFILE FORM -->
<div class="form-page">
  <div class="form-card">
    <h2>My Profile</h2>

    <input id="name" type="text" placeholder="Name">
    <input id="phone" type="tel" placeholder="Phone">
    <input id="blood" type="text" placeholder="Blood Group">

    <button onclick="saveProfile()">Save</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } 
from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyD83CLOYhpKG7OE9Ukf8s60q8IJHQaxdJA",
  authDomain: "volunteerconnect-58acf.firebaseapp.com",
  projectId: "volunteerconnect-58acf",
  storageBucket: "volunteerconnect-58acf.firebasestorage.app",
  messagingSenderId: "298160451417",
  appId: "1:298160451417:web:e391244431246b63f32648"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* LOAD USER DATA */
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  try {
    const docRef = doc(db, "users", user.uid);
    const snap = await getDoc(docRef);

    if (snap.exists()) {
      const data = snap.data();

      document.getElementById("name").value = data.name || "";
      document.getElementById("phone").value = data.phone || "";
      document.getElementById("blood").value = data.bloodGroup || "";
    }

  } catch (error) {
    console.error("Error loading profile:", error);
  }
});

/* SAVE PROFILE */
window.saveProfile = async () => {

  const user = auth.currentUser;

  if (!user) {
    alert("User not logged in");
    return;
  }

  try {
    await setDoc(doc(db, "users", user.uid), {
      name: document.getElementById("name").value,
      phone: document.getElementById("phone").value,
      bloodGroup: document.getElementById("blood").value,
      email: user.email
    }, { merge: true });

    alert("Profile saved successfully ✅");

  } catch (error) {
    console.error("Error saving profile:", error);
    alert("Error saving profile ❌");
  }
};
</script>

</body>
</html>
